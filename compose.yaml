services:
  mcp-image:
    image: mcp-image:local
    build: .
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: "3000"
      MCP_HTTP_TOKEN: ${MCP_HTTP_TOKEN:?Set a random MCP_HTTP_TOKEN in .env}
    ports:
      - "127.0.0.1:${HTTP_PORT:-3001}:3000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
